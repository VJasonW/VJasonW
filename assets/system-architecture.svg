<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="frameBg" x1="0" y1="0" x2="960" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0E14"/>
      <stop offset="100%" stop-color="#08080B"/>
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A24"/>
      <stop offset="100%" stop-color="#121219"/>
    </linearGradient>

    <linearGradient id="connectorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFDB70" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFDB70" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFDB70" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', 'Plus Jakarta Sans', Roboto, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="960" height="220" rx="16" fill="url(#frameBg)"/>
  <rect x="1" y="1" width="958" height="218" rx="15" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(36, 36)">
    <circle cx="6" cy="6" r="3" fill="#FFDB70"/>
    <text x="20" y="10" class="font-mono" font-size="11" font-weight="600" fill="#FFDB70" letter-spacing="0.18em">HOW I ARCHITECT &amp; BRIDGE PRODUCTS</text>
  </g>

  <!-- Flow Connector Line -->
  <line x1="120" y1="125" x2="840" y2="125" stroke="url(#connectorGrad)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Step 1 -->
  <g transform="translate(36, 68)">
    <rect width="195" height="114" rx="12" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="1" y="1" width="193" height="1" fill="#FFFFFF" fill-opacity="0.1"/>
    <circle cx="20" cy="24" r="10" fill="#FFDB70" fill-opacity="0.1"/>
    <text x="20" y="28" class="font-mono" font-size="10.5" font-weight="700" fill="#FFDB70" text-anchor="middle">01</text>
    <text x="40" y="27" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF">Discover &amp; Scope</text>
    <text x="18" y="56" class="font-sans" font-size="11" font-weight="400" fill="#A1A1AA">• Pain point synthesis</text>
    <text x="18" y="74" class="font-sans" font-size="11" font-weight="400" fill="#A1A1AA">• Strategic constraints</text>
    <text x="18" y="92" class="font-sans" font-size="11" font-weight="400" fill="#A1A1AA">• Measurable goals</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(255, 68)">
    <rect width="210" height="114" rx="12" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="1" y="1" width="208" height="1" fill="#FFFFFF" fill-opacity="0.1"/>
    <circle cx="20" cy="24" r="10" fill="#FFDB70" fill-opacity="0.1"/>
    <text x="20" y="28" class="font-mono" font-size="10.5" font-weight="700" fill="#FFDB70" text-anchor="middle">02</text>
    <text x="40" y="27" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF">System Architecture</text>
    <text x="18" y="56" class="font-sans" font-size="11" font-weight="400" fill="#A1A1AA">• Information architecture</text>
    <text x="18" y="74" class="font-sans" font-size="11" font-weight="400" fill="#A1A1AA">• End-to-end user flows</text>
    <text x="18" y="92" class="font-sans" font-size="11" font-weight="400" fill="#A1A1AA">• Domain logic &amp; states</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(489, 68)">
    <rect width="205" height="114" rx="12" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="1" y="1" width="203" height="1" fill="#FFFFFF" fill-opacity="0.1"/>
    <circle cx="20" cy="24" r="10" fill="#FFDB70" fill-opacity="0.1"/>
    <text x="20" y="28" class="font-mono" font-size="10.5" font-weight="700" fill="#FFDB70" text-anchor="middle">03</text>
    <text x="40" y="27" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF">UX &amp; Wireframing</text>
    <text x="18" y="56" class="font-sans" font-size="11" font-weight="400" fill="#A1A1AA">• Low-fidelity concepts</text>
    <text x="18" y="74" class="font-sans" font-size="11" font-weight="400" fill="#A1A1AA">• Interaction hierarchies</text>
    <text x="18" y="92" class="font-sans" font-size="11" font-weight="400" fill="#A1A1AA">• Rapid feedback loops</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(718, 68)">
    <rect width="205" height="114" rx="12" fill="url(#nodeGrad)" stroke="#FFDB70" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="1" y="1" width="203" height="1" fill="#FFDB70" fill-opacity="0.25"/>
    <circle cx="20" cy="24" r="10" fill="#FFDB70" fill-opacity="0.2"/>
    <text x="20" y="28" class="font-mono" font-size="10.5" font-weight="700" fill="#FFDB70" text-anchor="middle">04</text>
    <text x="40" y="27" class="font-sans" font-size="13" font-weight="600" fill="#FFDB70">Anti-Slop Build</text>
    <text x="18" y="56" class="font-sans" font-size="11" font-weight="400" fill="#E4E4E7">• Next.js / TypeScript</text>
    <text x="18" y="74" class="font-sans" font-size="11" font-weight="400" fill="#E4E4E7">• Feasibility alignment</text>
    <text x="18" y="92" class="font-sans" font-size="11" font-weight="400" fill="#E4E4E7">• High-taste execution</text>
  </g>
</svg>
