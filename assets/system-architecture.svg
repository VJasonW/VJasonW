<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="frameBg" x1="0" y1="0" x2="960" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0E14"/>
      <stop offset="100%" stop-color="#08080B"/>
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#101016"/>
    </linearGradient>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', 'Plus Jakarta Sans', Roboto, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="960" height="210" rx="14" fill="url(#frameBg)"/>
  <rect x="1" y="1" width="958" height="208" rx="13" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(32, 32)">
    <circle cx="5" cy="5" r="3" fill="#FFDB70"/>
    <text x="16" y="9" class="font-mono" font-size="11" font-weight="600" fill="#FFDB70" letter-spacing="0.05em">PRODUCT DELIVERY PIPELINE</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(32, 60)">
    <rect width="206" height="118" rx="10" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <text x="16" y="27" class="font-mono" font-size="11" font-weight="700" fill="#FFDB70">01</text>
    <text x="38" y="27" class="font-sans" font-size="13" font-weight="600" fill="#FAFAFA">Discover &amp; Scope</text>
    <text x="16" y="56" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">Problem space synthesis</text>
    <text x="16" y="74" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">User friction mapping</text>
    <text x="16" y="92" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">Measurable product goals</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(254, 60)">
    <rect width="216" height="118" rx="10" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <text x="16" y="27" class="font-mono" font-size="11" font-weight="700" fill="#FFDB70">02</text>
    <text x="38" y="27" class="font-sans" font-size="13" font-weight="600" fill="#FAFAFA">System Architecture</text>
    <text x="16" y="56" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">Information architecture</text>
    <text x="16" y="74" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">End-to-end user flows</text>
    <text x="16" y="92" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">Domain logic and state models</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(486, 60)">
    <rect width="210" height="118" rx="10" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <text x="16" y="27" class="font-mono" font-size="11" font-weight="700" fill="#FFDB70">03</text>
    <text x="38" y="27" class="font-sans" font-size="13" font-weight="600" fill="#FAFAFA">UX &amp; Wireframing</text>
    <text x="16" y="56" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">Low-to-mid fidelity concepts</text>
    <text x="16" y="74" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">Interaction hierarchy tests</text>
    <text x="16" y="92" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">Rapid validation cycles</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(712, 60)">
    <rect width="216" height="118" rx="10" fill="url(#nodeGrad)" stroke="#FFDB70" stroke-opacity="0.3" stroke-width="1"/>
    <text x="16" y="27" class="font-mono" font-size="11" font-weight="700" fill="#FFDB70">04</text>
    <text x="38" y="27" class="font-sans" font-size="13" font-weight="600" fill="#FFDB70">Engineering Bridge</text>
    <text x="16" y="56" class="font-sans" font-size="11.5" font-weight="400" fill="#E4E4E7">Technical feasibility checks</text>
    <text x="16" y="74" class="font-sans" font-size="11.5" font-weight="400" fill="#E4E4E7">Next.js and TypeScript specs</text>
    <text x="16" y="92" class="font-sans" font-size="11.5" font-weight="400" fill="#E4E4E7">Design system governance</text>
  </g>
</svg>
