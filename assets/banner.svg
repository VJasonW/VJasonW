<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090D"/>
      <stop offset="60%" stop-color="#0E0E14"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#101016"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', 'Plus Jakarta Sans', Roboto, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Architectural Outer Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(56, 52)">
    <!-- Availability Indicator -->
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#14141C" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#10B981"/>
    <text x="28" y="19" class="font-sans" font-size="11" font-weight="600" fill="#E4E4E7" letter-spacing="0.03em">OPEN FOR PROJECTS</text>

    <!-- Location -->
    <g transform="translate(232, 0)">
      <rect x="0" y="0" width="180" height="30" rx="8" fill="#14141C" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <text x="14" y="19" class="font-sans" font-size="11" font-weight="500" fill="#A1A1AA">Semarang, ID (GMT+7)</text>
    </g>

    <!-- Portfolio Domain -->
    <g transform="translate(930, 0)">
      <text x="158" y="19.5" class="font-mono" font-size="12" font-weight="500" fill="#FFDB70" text-anchor="end">jasonwidjaya.my.id</text>
    </g>
  </g>

  <!-- Headline Section -->
  <g transform="translate(56, 134)">
    <text x="0" y="0" class="font-mono" font-size="12" font-weight="600" fill="#FFDB70" letter-spacing="0.05em">PRODUCT &amp; SYSTEM ARCHITECTURE</text>
    <text x="0" y="44" class="font-sans" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.03em">JASON WIDJAYA</text>
    <text x="0" y="78" class="font-sans" font-size="15" font-weight="400" fill="#A1A1AA">
      Deconstructing complex problem spaces into coherent system logic, clear UX architecture, and execution roadmaps.
    </text>
  </g>

  <!-- Three Focus Cards -->
  <g transform="translate(56, 252)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <rect width="350" height="74" rx="10" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <text x="16" y="26" class="font-mono" font-size="10.5" font-weight="600" fill="#FFDB70" letter-spacing="0.04em">01 / LOGIC &amp; SCOPING</text>
      <text x="16" y="48" class="font-sans" font-size="13.5" font-weight="600" fill="#FAFAFA">System Architecture</text>
      <text x="16" y="64" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">End-to-end user flows, domain models, and specs</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(368, 0)">
      <rect width="350" height="74" rx="10" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <text x="16" y="26" class="font-mono" font-size="10.5" font-weight="600" fill="#FFDB70" letter-spacing="0.04em">02 / INTERACTION PATTERNS</text>
      <text x="16" y="48" class="font-sans" font-size="13.5" font-weight="600" fill="#FAFAFA">UX &amp; Wireframing</text>
      <text x="16" y="64" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">Information density, wireframes, and prototypes</text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(736, 0)">
      <rect width="352" height="74" rx="10" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <text x="16" y="26" class="font-mono" font-size="10.5" font-weight="600" fill="#FFDB70" letter-spacing="0.04em">03 / TECHNICAL BRIDGE</text>
      <text x="16" y="48" class="font-sans" font-size="13.5" font-weight="600" fill="#FAFAFA">Engineering Feasibility</text>
      <text x="16" y="64" class="font-sans" font-size="11.5" font-weight="400" fill="#A1A1AA">TypeScript, Next.js, and design system governance</text>
    </g>
  </g>
</svg>
