<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090D"/>
      <stop offset="50%" stop-color="#0E0E14"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="amberGlow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FFDB70" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#FFDB70" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#09090D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlow" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#09090D" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181820" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#101016" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE899"/>
      <stop offset="100%" stop-color="#FFDB70"/>
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', 'Plus Jakarta Sans', Roboto, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      }
    </style>
  </defs>

  <!-- Canvas Outer Boundary -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="20" fill="url(#amberGlow)"/>
  <rect width="1200" height="420" rx="20" fill="url(#indigoGlow)"/>
  <rect width="1200" height="420" rx="20" fill="url(#dotPattern)"/>

  <!-- Outer Shell Border (Double-Bezel Technique) -->
  <rect x="1" y="1" width="1198" height="418" rx="19" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Inner Architectural Frame -->
  <rect x="24" y="24" width="1152" height="372" rx="14" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- TOP BAR: Status & Location -->
  <g transform="translate(60, 68)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#171720" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <!-- Pulsing Green Dot -->
    <circle cx="18" cy="16" r="4.5" fill="#10B981"/>
    <circle cx="18" cy="16" r="7.5" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="34" y="20.5" class="font-sans" font-size="11.5" font-weight="600" fill="#E4E4E7" letter-spacing="0.06em">OPEN FOR COLLABORATION</text>

    <!-- Location Pill -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#171720" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="18" cy="16" r="3.5" fill="#FFDB70"/>
      <text x="32" y="20.5" class="font-sans" font-size="11.5" font-weight="500" fill="#A1A1AA" letter-spacing="0.04em">SEMARANG, ID (GMT+7)</text>
    </g>

    <!-- Portfolio Link Indicator -->
    <g transform="translate(860, 0)">
      <text x="170" y="21" class="font-mono" font-size="12" font-weight="500" fill="#FFDB70" text-anchor="end" letter-spacing="0.05em">jasonwidjaya.my.id ↗</text>
    </g>
  </g>

  <!-- MAIN HEADLINE BLOCK -->
  <g transform="translate(60, 160)">
    <!-- Eyebrow -->
    <text x="0" y="0" class="font-mono" font-size="12" font-weight="600" fill="#FFDB70" letter-spacing="0.22em">PRODUCT &amp; SYSTEM ARCHITECTURE</text>

    <!-- Main Name -->
    <text x="0" y="52" class="font-sans" font-size="48" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.035em">JASON WIDJAYA</text>

    <!-- Value Proposition -->
    <text x="0" y="90" class="font-sans" font-size="17" font-weight="400" fill="#A1A1AA" letter-spacing="-0.01em">
      Turning user pain points into coherent system logic, clear UX architecture, and creative roadmaps.
    </text>
  </g>

  <!-- BOTTOM CAPABILITIES BENTO CARDS -->
  <g transform="translate(60, 290)">
    <!-- Card 1: Product Logic -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="345" height="78" rx="10" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="1" y="1" width="343" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="18" y="28" class="font-mono" font-size="11" font-weight="600" fill="#FFDB70" letter-spacing="0.1em">01 / LOGIC &amp; SCOPE</text>
      <text x="18" y="52" class="font-sans" font-size="14" font-weight="600" fill="#FAFAFA">System Architecture</text>
      <text x="18" y="67" class="font-sans" font-size="11.5" font-weight="400" fill="#71717A">End-to-end flows, specs &amp; product maps</text>
    </g>

    <!-- Card 2: UX Strategy -->
    <g transform="translate(365, 0)">
      <rect x="0" y="0" width="345" height="78" rx="10" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="1" y="1" width="343" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="18" y="28" class="font-mono" font-size="11" font-weight="600" fill="#FFDB70" letter-spacing="0.1em">02 / INTERACTION</text>
      <text x="18" y="52" class="font-sans" font-size="14" font-weight="600" fill="#FAFAFA">UX &amp; Wireframing</text>
      <text x="18" y="67" class="font-sans" font-size="11.5" font-weight="400" fill="#71717A">Intuitive hierarchies &amp; rapid prototypes</text>
    </g>

    <!-- Card 3: Anti-Slop Web Execution -->
    <g transform="translate(730, 0)">
      <rect x="0" y="0" width="350" height="78" rx="10" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="1" y="1" width="348" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="18" y="28" class="font-mono" font-size="11" font-weight="600" fill="#FFDB70" letter-spacing="0.1em">03 / CRAFT &amp; CODE</text>
      <text x="18" y="52" class="font-sans" font-size="14" font-weight="600" fill="#FAFAFA">Anti-Slop Web Engineering</text>
      <text x="18" y="67" class="font-sans" font-size="11.5" font-weight="400" fill="#71717A">Next.js, TypeScript &amp; purposeful UI</text>
    </g>
  </g>
</svg>
